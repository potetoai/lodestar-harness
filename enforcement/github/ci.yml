# Managed by lodestar-harness. Edit in lodestar-harness/enforcement, not by hand.
# CI only calls `make`; language differences live in the project's Makefile.
name: CI

# Minutes matter on private repos (GitHub Free: 2000 a month). Main is not
# re-run on every merge (the PR already ran the same code): a weekly run checks
# main when it changed in the last week, which catches two PRs that break each
# other. A new push to a PR cancels its older run. A PR that changes only
# Markdown (and the approval log a plan PR carries) skips setup and verify;
# the scans and PR checks still run.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled] # labeled: the "test-mutation" label reruns CI
  schedule:
    - cron: '17 3 * * 1' # weekly (Monday), main only
  workflow_dispatch: # run on demand (Actions tab, or gh workflow run CI)

concurrency:
  # One run per PR; a label other than test-mutation gets its own group, so it cancels nothing.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'test-mutation' && github.run_id || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # PR checks read the PR text (route line)

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the secret scan

      # SKIP=all: weekly run, main has no commit in the last 7 days and an hour.
      # SKIP=verify: the PR changes only Markdown files and .ai/approvals.log.
      - name: What to run
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ -z "$(git log -1 --since='169 hours ago' --format=%H)" ]; then
            echo "SKIP=all" >> "$GITHUB_ENV"; echo "No commit on main in the last 7 days; nothing to check."
          elif [ "${{ github.event_name }}" = pull_request ] && ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE '\.md$|^\.ai/approvals\.log$'; then
            echo "SKIP=verify" >> "$GITHUB_ENV"; echo "Only Markdown files (and the approval log) changed; setup and verify skipped."
          fi

      # Toolchains: set up only what the project uses. A root .nvmrc or
      # .python-version pins the version (doctor A12b requires it); without
      # one CI takes the latest, which can change under a green project.
      - if: env.SKIP == '' && hashFiles('**/package.json') != '' && hashFiles('.nvmrc') == ''
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - if: env.SKIP == '' && hashFiles('**/package.json') != '' && hashFiles('.nvmrc') != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - if: env.SKIP == '' && hashFiles('**/requirements*.txt', '**/pyproject.toml') != '' && hashFiles('.python-version') == ''
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - if: env.SKIP == '' && hashFiles('**/requirements*.txt', '**/pyproject.toml') != '' && hashFiles('.python-version') != ''
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Setup
        if: env.SKIP == ''
        run: make setup

      # Sensitive paths need tests, lint suppressions need a reason, locked
      # tests stay unchanged (rules/testing.md). Before Verify, so a wrong PR
      # text fails in seconds; after Setup, because mutation testing needs it.
      - name: PR checks
        if: github.event_name == 'pull_request'
        env:
          LODESTAR_TEST_MUTATION: ${{ contains(github.event.pull_request.labels.*.name, 'test-mutation') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: bash .claude/hooks/ci-checks.sh "origin/${{ github.base_ref }}"

      - name: Verify
        if: env.SKIP == ''
        run: |
          if make -n verify-full >/dev/null 2>&1; then make verify-full; else make verify; fi

      # gitleaks is kept in the Actions cache, so a release-URL outage does not
      # turn CI red. The sha256 is checked on every run, cached or not. Changing
      # the version means changing the URL, the sha256 and the cache key together.
      - name: Restore gitleaks
        id: gitleaks-cache
        if: env.SKIP != 'all'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/lodestar-gitleaks
          key: gitleaks-8.30.1-linux-x64-551f6fc8

      - name: Get gitleaks
        if: env.SKIP != 'all'
        run: |
          mkdir -p ~/.cache/lodestar-gitleaks; cd ~/.cache/lodestar-gitleaks
          [ -f gitleaks.tar.gz ] || curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 20 --max-time 120 -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -

      # Saved here, not at job end: a job that fails later still keeps the download.
      - name: Save gitleaks
        if: env.SKIP != 'all' && steps.gitleaks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/lodestar-gitleaks
          key: gitleaks-8.30.1-linux-x64-551f6fc8

      - name: Secret scan (gitleaks)
        if: env.SKIP != 'all'
        run: |
          tar xzf ~/.cache/lodestar-gitleaks/gitleaks.tar.gz -C ~/.cache/lodestar-gitleaks gitleaks
          ~/.cache/lodestar-gitleaks/gitleaks git --redact --verbose .

      - name: Readiness (doctor)
        if: env.SKIP != 'all'
        run: bash .claude/hooks/doctor.sh
