# Managed by lodestar-harness. Edit in lodestar-harness/enforcement, not by hand.
# CI only calls `make`; language differences live in the project's Makefile.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled] # labeled: the "test-mutation" label reruns CI

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, for the secret scan

      # Toolchains: set up only what the project uses.
      - if: hashFiles('**/package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - if: hashFiles('**/requirements*.txt', '**/pyproject.toml') != ''
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Setup
        run: make setup

      - name: Verify
        run: |
          if make -n verify-full >/dev/null 2>&1; then make verify-full; else make verify; fi

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --verbose .

      # Sensitive paths need tests, lint suppressions need a reason, locked
      # tests stay unchanged (rules/testing.md).
      - name: PR checks
        if: github.event_name == 'pull_request'
        env:
          LODESTAR_TEST_MUTATION: ${{ contains(github.event.pull_request.labels.*.name, 'test-mutation') }}
        run: bash .claude/hooks/ci-checks.sh "origin/${{ github.base_ref }}"

      - name: Readiness (doctor)
        run: bash .claude/hooks/doctor.sh
