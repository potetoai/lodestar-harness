name: Enforcement self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # macOS ships bash 3.2; the hooks need bash 4 or newer (setup guide).
      - if: runner.os == 'macOS'
        run: brew install bash && echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - run: SETUP_HOME="$RUNNER_TEMP/home" bash enforcement/setup-machine.sh --yes --no-selftest
      - run: bash enforcement/test.sh
      - run: bash scripts/check-links.sh
